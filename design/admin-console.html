<!doctype html>
<html lang="zh-CN" data-theme="light" data-density="comfortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pass 管理控制台 · 重设计原型</title>
<link rel="stylesheet" href="../ds-bundle/styles.css">
<style>
/* ═══════════════════════════════════════════════════════════════
   布局胶水。只引用 _ds_bundle.css 已有的 token —— 无新造色值。
   自适应用容器查询而非视口断点：左栏折叠后工作区宽度会变，
   按视口判断会判断错。
   ═══════════════════════════════════════════════════════════════ */
:root {
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px;
  --sp-6:24px; --sp-8:32px; --sp-10:40px; --sp-12:48px;
  --rail-w: 232px; --rail-w-mini: 60px;
  --row-h: 48px;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
:root[data-density="compact"] { --row-h: 38px; }

html, body { height: 100%; }
body {
  margin: 0; background: var(--bg-color); color: var(--text-main);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 15px; line-height: var(--lh-body); -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
:focus-visible { outline: 2px solid var(--primary-pink); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; } }

/* ── 外壳 ───────────────────────────────────────────────────── */
.c-shell { display: grid; grid-template-columns: var(--rail-w) 1fr; min-height: 100vh; }
.c-shell[data-rail="mini"] { grid-template-columns: var(--rail-w-mini) 1fr; }

.c-rail {
  display: flex; flex-direction: column; gap: var(--sp-5);
  border-right: 1px solid var(--divider-color);
  padding: var(--sp-5) var(--sp-3) var(--sp-3);
  position: sticky; top: 0; height: 100vh; overflow-y: auto; overflow-x: hidden;
}
.c-brand { display: flex; align-items: center; gap: var(--sp-2); padding: 0 var(--sp-2); min-width: 0; }
.c-brand-mark { width:26px; height:26px; border-radius: var(--radius-xs); flex:none;
  background: var(--accent-pink); color: var(--on-accent); display:grid; place-items:center;
  font-weight:800; font-size:13px; letter-spacing:-.02em; }
.c-brand-text { display:flex; flex-direction:column; line-height:1.25; min-width:0; }
.c-brand-name { font-weight:700; font-size:14px; letter-spacing:-.01em; }
.c-brand-sub { font-size:11px; color: var(--text-muted); white-space:nowrap; }

.c-nav { display:flex; flex-direction:column; gap:2px; flex:1; min-width:0; }
.c-nav-group { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.09em;
  color: var(--text-muted); padding: var(--sp-3) var(--sp-2) var(--sp-1); white-space:nowrap; }
.c-nav-item {
  display:flex; align-items:center; gap: var(--sp-3);
  padding: var(--sp-2); min-height:36px; width:100%; text-align:left;
  border:none; background:none; border-radius: var(--radius-control); cursor:pointer;
  color: var(--text-secondary); font: inherit; font-size:14px; white-space:nowrap;
  transition: background-color var(--dur-fast) var(--ease-standard), color var(--dur-fast) var(--ease-standard);
}
.c-nav-item:hover { background: var(--hover-bg-mix, var(--hover-bg)); color: var(--text-main); }
.c-nav-item[aria-current="page"] { background: var(--soft-pink); color: var(--accent-pink); font-weight:600; }
:root[data-theme="dark"] .c-nav-item[aria-current="page"] { color: var(--text-main); }
.c-nav-icon { display:inline-flex; flex:none; }

.c-shell[data-rail="mini"] .c-brand-text,
.c-shell[data-rail="mini"] .c-nav-group,
.c-shell[data-rail="mini"] .c-nav-item > span:not(.c-nav-icon),
.c-shell[data-rail="mini"] .c-me-text { display:none; }
.c-shell[data-rail="mini"] .c-nav-item { justify-content:center; }

.c-rail-foot { border-top: 1px solid var(--divider-color); padding-top: var(--sp-3); }
.c-me { display:flex; align-items:center; gap: var(--sp-3); padding: var(--sp-2); width:100%;
  border:none; background:none; border-radius: var(--radius-control); cursor:pointer; font:inherit; text-align:left;
  transition: background-color var(--dur-fast) var(--ease-standard); }
.c-me:hover { background: var(--hover-bg-mix, var(--hover-bg)); }
.c-me-text { min-width:0; display:flex; flex-direction:column; line-height:1.3; }
.c-me-name { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.c-me-role { font-size:11px; color: var(--text-muted); white-space:nowrap; }

/* ── 主区：容器查询的锚点 ──────────────────────────────────── */
.c-main {
  background: var(--surface-card); min-width:0; display:flex; flex-direction:column;
  container-type: inline-size; container-name: work;
}
.c-topbar { display:flex; align-items:flex-start; gap: var(--sp-4);
  padding: var(--sp-5) var(--sp-8) var(--sp-4); border-bottom:1px solid var(--divider-color);
  position:sticky; top:0; z-index:5; background: var(--surface-card); flex-wrap:wrap; }
.c-crumb { display:flex; align-items:flex-start; gap: var(--sp-2); min-width:0; }
.c-title { margin:0; font-size:20px; font-weight:700; letter-spacing:-.02em; overflow-wrap:anywhere; }
.c-subtitle { font-size:13px; color: var(--text-muted); margin-top:2px; }
.c-body { padding: var(--sp-6) var(--sp-8) var(--sp-12); flex:1; min-width:0; }
/* 超宽屏：内容设上限并居中，避免一行拉太长没法读 */
.c-body > .c-wide { max-width: 1440px; margin-inline: auto; }

.c-stack { display:flex; flex-direction:column; gap: var(--sp-6); }
.c-stack-sm { display:flex; flex-direction:column; gap: var(--sp-3); }
.c-row { display:flex; align-items:center; gap: var(--sp-3); flex-wrap:wrap; }
.c-spread { display:flex; align-items:center; justify-content:space-between; gap: var(--sp-3); flex-wrap:wrap; }
.c-note { font-size:12.5px; color: var(--text-muted); }
.c-mono { font-family: var(--mono); font-size:12.5px; }
.c-num { font-variant-numeric: tabular-nums; color: var(--text-secondary); font-size:13px; white-space:nowrap; }

/* ── 筛选 ───────────────────────────────────────────────────── */
.c-filters { display:flex; align-items:center; gap: var(--sp-3); flex-wrap:wrap; }
.c-filters-search { flex:1; min-width:220px; max-width:420px; }
.c-chipset { display:inline-flex; gap: var(--sp-1); padding:3px; border-radius: var(--radius-pop);
  background: var(--hover-bg-mix, var(--hover-bg)); flex-wrap:wrap; }
.c-chip { border:none; background:none; cursor:pointer; font:inherit; font-size:13px;
  padding:5px var(--sp-3); border-radius: var(--radius-control); color: var(--text-secondary);
  transition: background-color var(--dur-fast) var(--ease-standard), color var(--dur-fast) var(--ease-standard); }
.c-chip:hover { color: var(--text-main); }
.c-chip[aria-pressed="true"] { background: var(--surface-card); color: var(--text-main); font-weight:600; box-shadow: var(--shadow-card); }
.c-urlbar { display:flex; align-items:center; gap: var(--sp-2); font-family: var(--mono); font-size:11.5px;
  color: var(--text-muted); background: var(--hover-bg-mix, var(--hover-bg));
  border:1px dashed var(--divider-color); border-radius: var(--radius-control);
  padding: var(--sp-2) var(--sp-3); overflow-x:auto; white-space:nowrap; }

/* ── 分页条 ─────────────────────────────────────────────────── */
.c-pager { display:flex; align-items:center; gap: var(--sp-4); flex-wrap:wrap; }
.c-pager-range { font-size:12.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.c-pager-size { display:inline-flex; align-items:center; gap: var(--sp-2); font-size:12.5px;
  color: var(--text-muted); }
.c-pager-size select { font:inherit; font-size:12.5px; border:1px solid var(--divider-color);
  border-radius: var(--radius-control); padding:3px var(--sp-2);
  background: var(--surface-card); color: var(--text-main); cursor:pointer; }
.c-pager-nav { margin-left:auto; display:flex; align-items:center; gap: var(--sp-1); flex-wrap:wrap; }
.c-page-btn {
  min-width:32px; height:32px; padding:0 var(--sp-2);
  border:1px solid var(--divider-color); background: var(--surface-card);
  border-radius: var(--radius-control); cursor:pointer;
  font: inherit; font-size:13px; font-variant-numeric: tabular-nums; color: var(--text-secondary);
  display:inline-flex; align-items:center; justify-content:center;
  transition: background-color var(--dur-fast) var(--ease-standard), color var(--dur-fast) var(--ease-standard);
}
.c-page-btn:hover:not(:disabled) { background: var(--hover-bg-mix, var(--hover-bg)); color: var(--text-main); }
.c-page-btn:disabled { opacity:.45; cursor:not-allowed; }
.c-page-btn[aria-current="page"] {
  background: var(--accent-pink); border-color: transparent; color: var(--on-accent); font-weight:700;
}
.c-page-gap { min-width:24px; text-align:center; color: var(--text-muted); font-size:13px; user-select:none; }
@media (pointer: coarse) { .c-page-btn { min-width:40px; height:40px; } }
@container work (max-width: 700px) {
  .c-pager-nav { margin-left:0; width:100%; justify-content:center; }
  .c-pager { justify-content:space-between; }
}

/* ── 表格（容器查询下变卡片） ──────────────────────────────── */
.c-table-wrap { border:1px solid var(--divider-color); border-radius: var(--radius-lg); overflow:hidden; }
.c-table-scroll { overflow-x:auto; }
table.c-table { width:100%; border-collapse:collapse; font-size:14px; }
.c-table thead th { text-align:left; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.07em;
  color: var(--text-muted); padding: var(--sp-3) var(--sp-4); white-space:nowrap;
  border-bottom:1px solid var(--divider-color); background: var(--surface-card); position:sticky; top:0; z-index:1; }
.c-th-sort { background:none; border:none; font:inherit; color:inherit; cursor:pointer; padding:0;
  display:inline-flex; align-items:center; gap: var(--sp-1); text-transform:inherit; letter-spacing:inherit; }
.c-th-sort:hover { color: var(--text-main); }
.c-table tbody tr { border-bottom:1px solid var(--divider-color); }
.c-table tbody tr:last-child { border-bottom:none; }
.c-table tbody tr.c-clickable { cursor:pointer; transition: background-color var(--dur-fast) var(--ease-standard); }
.c-table tbody tr.c-clickable:hover { background: var(--hover-bg-mix, var(--hover-bg)); }
.c-table tbody tr.c-clickable:focus-visible { outline:2px solid var(--primary-pink); outline-offset:-2px; }
.c-table td { padding:0 var(--sp-4); height: var(--row-h); vertical-align:middle; }
.c-table td.c-td-tight { padding-top: var(--sp-2); padding-bottom: var(--sp-2); }
.c-cell-primary { display:flex; align-items:center; gap: var(--sp-3); min-width:0; }
.c-cell-text { min-width:0; display:flex; flex-direction:column; line-height:1.35; }
.c-cell-name { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.c-cell-sub { font-size:12px; color: var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.c-self-tag { font-size:10.5px; font-weight:700; color: var(--accent-pink); border:1px solid var(--primary-pink);
  border-radius: var(--radius-xs); padding:1px 5px; letter-spacing:.04em; white-space:nowrap; }
.c-staff-tag { font-size:10.5px; font-weight:700; color: var(--soft-info-text); border:1px solid var(--soft-info-border);
  background: var(--soft-info-bg); border-radius: var(--radius-xs); padding:1px 5px;
  letter-spacing:.04em; white-space:nowrap; }

/* 中等宽度：次要列先走 */
@container work (max-width: 1040px) { .c-col-2 { display:none; } }
@container work (max-width: 860px)  { .c-col-1 { display:none; } }
/* 窄：整表变卡片。保留 table 语义，仅改显示。 */
@container work (max-width: 700px) {
  .c-table-wrap { border:none; border-radius:0; }
  .c-table thead { display:none; }
  .c-table, .c-table tbody, .c-table tr, .c-table td { display:block; width:100%; }
  .c-table tbody tr { border:1px solid var(--divider-color); border-radius: var(--radius-md);
    margin-bottom: var(--sp-3); padding: var(--sp-2) var(--sp-3); background: var(--surface-card); }
  .c-table td { height:auto; padding: var(--sp-2) 0; display:flex; align-items:center;
    justify-content:space-between; gap: var(--sp-4); text-align:right; }
  .c-table td::before { content: attr(data-label); color: var(--text-muted); font-size:11.5px;
    font-weight:600; text-transform:uppercase; letter-spacing:.05em; flex:none; text-align:left; }
  .c-table td[data-primary]::before { display:none; }
  .c-table td[data-primary] { justify-content:flex-start; text-align:left;
    padding-bottom: var(--sp-3); border-bottom:1px solid var(--divider-color); margin-bottom: var(--sp-1); }
  .c-table td[data-label=""]::before { display:none; }
  .c-col-1, .c-col-2 { display:flex; }
}

/* ── 状态数字块（无图表：8 个账户画比例条是数据浮夸） ──────── */
.c-kpis { display:grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--sp-3); }
.c-kpi { border:1px solid var(--divider-color); border-radius: var(--radius-md);
  padding: var(--sp-4); display:flex; flex-direction:column; gap:2px; min-width:0; }
.c-kpi-label { font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.06em;
  color: var(--text-muted); }
.c-kpi-value { font-size:30px; font-weight:700; letter-spacing:-.03em; line-height:1.15;
  font-variant-numeric: tabular-nums; color: var(--text-main); }
.c-kpi-unit { font-size:14px; font-weight:600; color: var(--text-secondary); margin-left:2px; }
.c-kpi-sub { font-size:12px; color: var(--text-muted); }
.c-breakdown { display:flex; flex-direction:column; }
.c-breakdown-row { display:flex; align-items:center; justify-content:space-between; gap: var(--sp-4);
  padding: var(--sp-3) 0; }
.c-breakdown-row + .c-breakdown-row { border-top:1px solid var(--divider-color); }
.c-breakdown-n { font-variant-numeric: tabular-nums; font-weight:600; font-size:15px; color: var(--text-main); }

/* ── 分区保存条 ─────────────────────────────────────────────── */
.c-savebar { display:flex; align-items:center; justify-content:flex-end; gap: var(--sp-3);
  margin-top: var(--sp-4); padding-top: var(--sp-4); border-top:1px solid var(--divider-color); }
.c-savebar-hint { margin-right:auto; font-size:12.5px; color: var(--text-muted); }

/* ── 详情 ───────────────────────────────────────────────────── */
.c-detail-head { display:flex; align-items:flex-start; gap: var(--sp-4); flex-wrap:wrap; }
.c-detail-id { font-family: var(--mono); font-size:12px; color: var(--text-muted); overflow-wrap:anywhere; }
.c-grid-2 { display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--sp-4); align-items:start; }
@container work (max-width: 700px) { .c-grid-2 { grid-template-columns: 1fr; } }
.c-danger-zone { border-top:1px dashed var(--divider-color); margin-top: var(--sp-4); padding-top: var(--sp-4); }
.c-impact { background: var(--soft-amber-bg); border:1px solid var(--soft-amber-border);
  border-radius: var(--radius-control); padding: var(--sp-3); font-size:13px; color: var(--soft-amber-text); }

/* ── 代码 / 复制 ────────────────────────────────────────────── */
.c-code { font-family: var(--mono); font-size:12.5px; line-height:1.75;
  background: var(--hover-bg-mix, var(--hover-bg)); border:1px solid var(--divider-color);
  border-radius: var(--radius-md); padding: var(--sp-4); margin:0; overflow-x:auto;
  color: var(--text-body); white-space:pre; }
.c-copyfield { display:flex; align-items:center; gap: var(--sp-2); border:1px solid var(--divider-color);
  border-radius: var(--radius-control); padding: var(--sp-1) var(--sp-1) var(--sp-1) var(--sp-3);
  background: var(--surface-card); min-width:0; }
.c-copyfield code { font-family: var(--mono); font-size:12.5px; flex:1; min-width:0; overflow-x:auto; white-space:nowrap; }

/* ── 变更缓冲区 / diff ─────────────────────────────────────── */
.c-diff { display:grid; grid-template-columns: minmax(90px, auto) 1fr; gap: var(--sp-2) var(--sp-4); font-size:13px; }
.c-diff-k { color: var(--text-muted); }
.c-diff-v { min-width:0; }
.c-diff-old { color: var(--soft-error-text); text-decoration: line-through; overflow-wrap:anywhere; }
.c-diff-new { color: var(--soft-success-text); overflow-wrap:anywhere; }

/* ── 向导 ───────────────────────────────────────────────────── */
.c-wizard { display:grid; grid-template-columns: minmax(0,1fr) 300px; gap: var(--sp-8); align-items:start; }
@container work (max-width: 1000px) { .c-wizard { grid-template-columns: 1fr; } .c-derived { position:static !important; } }
.c-steps { display:flex; gap: var(--sp-2); margin-bottom: var(--sp-6); flex-wrap:wrap; }
.c-step { display:flex; align-items:center; gap: var(--sp-2); font-size:12.5px; color: var(--text-muted); }
.c-step-dot { width:22px; height:22px; border-radius:50%; display:grid; place-items:center; flex:none;
  border:1px solid var(--divider-color); font-size:11px; font-weight:700; }
.c-step[data-state="current"] { color: var(--text-main); font-weight:600; }
.c-step[data-state="current"] .c-step-dot { background: var(--accent-pink); color: var(--on-accent); border-color:transparent; }
.c-step[data-state="done"] .c-step-dot { background: var(--soft-success-bg); color: var(--soft-success-text); border-color: var(--soft-success-border); }
.c-step-line { flex:1; height:1px; background: var(--divider-color); min-width: var(--sp-4); align-self:center; }
.c-derived { position:sticky; top:96px; }
.c-derived-row { display:flex; justify-content:space-between; gap: var(--sp-3); padding: var(--sp-2) 0;
  border-bottom:1px solid var(--divider-color); font-size:12.5px; }
.c-derived-row:last-child { border-bottom:none; }
.c-derived-k { color: var(--text-muted); white-space:nowrap; }
.c-derived-v { font-family: var(--mono); text-align:right; color: var(--text-body); overflow-wrap:anywhere; }
.c-uri-check { display:flex; align-items:flex-start; gap: var(--sp-2); font-size:12.5px; padding: var(--sp-1) 0; }
.c-uri-ok { color: var(--soft-success-text); }
.c-uri-bad { color: var(--soft-error-text); }
.c-uri-warn { color: var(--soft-amber-text); }

/* ── step-up ────────────────────────────────────────────────── */
.c-stepup { border:1px solid var(--soft-amber-border); background: var(--soft-amber-bg);
  border-radius: var(--radius-md); padding: var(--sp-4); }
.c-stepup-what { font-size:12.5px; color: var(--soft-amber-text); margin-bottom: var(--sp-3); }

/* ── 同意屏预览 ─────────────────────────────────────────────── */
.c-preview { border:1px solid var(--divider-color); border-radius: var(--radius-md);
  background: var(--bg-color); padding: var(--sp-5); }
.c-preview-frame { max-width: 22rem; margin-inline:auto; }
.c-preview-chrome { display:flex; align-items:center; gap: var(--sp-2); font-size:11px;
  color: var(--text-muted); margin-bottom: var(--sp-3); font-family: var(--mono); }

/* ── 场景 ───────────────────────────────────────────────────── */
.c-scene { min-height:100vh; display:grid; place-items:center; padding: var(--sp-8); background: var(--bg-color); }
.c-scene-card { width:100%; max-width:26rem; }

/* ── 授权中间页 ─────────────────────────────────────────────── */
.c-consent-shell { width:100%; max-width:24rem; }
.c-consent-heads { display:flex; align-items:center; justify-content:center; gap: var(--sp-4);
  margin-bottom: var(--sp-5); }
.c-consent-arrow { display:inline-flex; color: var(--text-muted); }
.c-consent-title { margin:0 0 var(--sp-2); font-size:18px; font-weight:700; line-height:1.45;
  letter-spacing:-.01em; text-align:center; text-wrap:pretty; }
.c-consent-as { margin:0 0 var(--sp-5); text-align:center; font-size:13px; color: var(--text-secondary);
  display:flex; flex-direction:column; gap:2px; }
.c-consent-mail { font-size:12.5px; color: var(--text-muted); overflow-wrap:anywhere; }
.c-consent-scopes { border:1px solid var(--divider-color); border-radius: var(--radius-md);
  padding: var(--sp-4); margin-bottom: var(--sp-5); }
.c-consent-scopes-h { display:block; font-size:11px; font-weight:700; text-transform:uppercase;
  letter-spacing:.08em; color: var(--text-muted); margin-bottom: var(--sp-3); }
.c-consent-list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap: var(--sp-3); }
.c-consent-list li { display:flex; align-items:flex-start; gap: var(--sp-3); font-size:14px;
  color: var(--text-body); line-height:1.5; text-wrap:pretty; }
.c-consent-tick { display:inline-flex; flex:none; margin-top:3px; color: var(--soft-success-text); }

function relMinutes(text) {
  if (!text) return Number.MAX_SAFE_INTEGER;
  if (text.indexOf('刚刚') >= 0) return 0;
  var m = text.match(/(\d+)/);
  var n = m ? Number(m[1]) : 0;
  if (text.indexOf('分钟') >= 0) return n;
  if (text.indexOf('小时') >= 0) return n * 60;
  if (text.indexOf('个月') >= 0) return n * 60 * 24 * 30;
  if (text.indexOf('天') >= 0) return n * 60 * 24;
  return Number.MAX_SAFE_INTEGER;
}

  var key = sort.key, dir = sort.dir === 'asc' ? 1 : -1;

    if (key === 'name') return u.name;
    if (key === 'status') return STATUS_ORDER[u.status];
    if (key === 'sessions') return u.sessions.length;
    /* 越近发生 → 值越大，于是「降序」= 最近的在前，符合直觉 */
    if (key === 'last') return -relMinutes(u.last);
    return 0;

  return list.slice().sort(function (a, b) {
    var va = valueOf(a), vb = valueOf(b), c;

    return a.id < b.id ? -1 : a.id > b.id ? 1 : 0;

}

/**
 * 员工判定：绑定了 IAM 且在 tc_main 下仍持有权限的账户 = 工作人员。
 * 工作人员不能被其他工作人员操作 —— 直到 IAM 权限被撤空为止。
 *
 * 关键：这个判定必须对目标账户**实时查 IAM**，不能读登录时的快照。
 * 读快照会两头出错：撤权后仍被锁住改不了，或撤权前被误放行。
 * IAM 不可达时按「仍是员工」处理（fail-closed）—— 证明不了不是员工，就不能动。
 */
var IAM_REACHABLE = { value: true };   /* 由右下角开关控制，用于演示 fail-closed */

/**
 * 判定结果由后端给出明确的 verdict，前端不从权限数组的「形状」自行推断 ——
 * 数组缺失/为空/查询失败是三件不同的事，混为一谈就会在 IAM 抖动时把员工账户放开。
 *   not_staff     未绑定统一身份            → 可操作
 *   staff         绑定且仍持有 tc_main 权限  → 锁定
 *   ex_staff      绑定但权限已撤空          → 可操作
 *   staff_assumed 查询失败/超时             → 锁定（fail-closed）
 */
function iamVerdict(u) {
  var i = u.iam || null;
  if (!i) return 'not_staff';
  /* IAM 不可达时后端会返回 staff_assumed，这里模拟那条响应。 */
  if (!IAM_REACHABLE.value) return 'staff_assumed';
  /* 正常情况直接消费后端给的 verdict —— 不从 perms 数组的形状自行推断，
     因为「数组缺失 / 为空 / 查询失败」是三件不同的事，混为一谈就会在 IAM 抖动时放开员工账户。 */
  return i.verdict;
}
function isStaffAccount(u) {
  var v = iamVerdict(u);
  return v === 'staff' || v === 'staff_assumed';
}
function wasStaffAccount(u) { return iamVerdict(u) === 'ex_staff'; }

/** 员工名册由用户表推导，不另存一份，避免两边漂移。 */

/**
 * 分页控件：页码直达 + 上/下一页 + 每页条数。
 *
 * 这要求后端是 offset/limit 且返回总数 —— 游标分页做不到「跳到第 5 页」，
 * 它只知道下一段从哪开始。仓库里现有的 Pagination 组件注释写得很清楚：
 * 「后端为游标分页、无总数，故不做页码直达」。所以这是一次对外契约变更，
 * 已记进 api-delta.md。
 *
 * 页码带省略号：首页、末页、当前页 ±1 恒显示，中间折叠。
 */
function pageList(current, total) {
  if (total <= 7) return Array.from({ length: total }, function (_, i) { return i + 1; });
  var out = [1];
  var from = Math.max(2, current - 1), to = Math.min(total - 1, current + 1);
  if (from > 2) out.push('gap-l');
  for (var i = from; i <= to; i++) out.push(i);
  if (to < total - 1) out.push('gap-r');
  out.push(total);
  return out;
}

function Pager(props) {
  var total = props.total, size = props.size, page = props.page;
  var pages = Math.max(1, Math.ceil(total / size));
  var first = total === 0 ? 0 : (page - 1) * size + 1;
  var last = Math.min(page * size, total);

  return h('nav', { className:'c-pager', 'aria-label': props.ariaLabel || '分页' },
    h('span', { className:'c-pager-range' },
      total === 0 ? '没有匹配的记录' : ('共 ' + total + ' 条 · 第 ' + first + '–' + last + ' 条')),
    h('label', { className:'c-pager-size' }, '每页',
      h('select', { value: String(size), 'aria-label':'每页条数',
        onChange: function (e) { props.onSize(Number(e.target.value)); } },
        [10, 20, 50].map(function (n) { return h('option', { key:n, value:String(n) }, n); })),
      '条'),
    h('div', { className:'c-pager-nav' },
      h('button', { className:'c-page-btn', disabled: page <= 1, 'aria-label':'上一页',
        onClick: function () { props.onPage(page - 1); } }, '‹'),
      pageList(page, pages).map(function (n) {
        if (typeof n === 'string') {
          return h('span', { key:n, className:'c-page-gap', 'aria-hidden':'true' }, '…');
        }
        return h('button', { key:n, className:'c-page-btn',
          'aria-current': n === page ? 'page' : undefined,
          'aria-label': '第 ' + n + ' 页',
          onClick: function () { props.onPage(n); } }, n);
      }),
      h('button', { className:'c-page-btn', disabled: page >= pages, 'aria-label':'下一页',
        onClick: function () { props.onPage(page + 1); } }, '›')));
}

/* 配置驱动的表格。窄容器下由 CSS 变卡片，data-label 提供字段名。 */
function Table(props) {
  var cols = props.columns, rows = props.rows;
  var sort = props.sort, onSort = props.onSort;
  if (!rows.length) return h(Card, null, h(EmptyState, { title: props.emptyTitle || '没有数据',
    description: props.emptyDesc }));
  return h('div', { className:'c-table-wrap' }, h('div', { className:'c-table-scroll' },
    h('table', { className:'c-table' },
      h('thead', null, h('tr', null, cols.map(function (c) {
        var cls = c.hideAt === 1 ? 'c-col-1' : c.hideAt === 2 ? 'c-col-2' : undefined;
        if (!c.sortKey || !onSort) return h('th', { key:c.key, scope:'col', className:cls,
          style:{ width:c.width, textAlign:c.align } }, c.label);
        var active = sort && sort.key === c.sortKey;
        return h('th', { key:c.key, scope:'col', className:cls, style:{ width:c.width, textAlign:c.align },
          'aria-sort': active ? (sort.dir === 'asc' ? 'ascending' : 'descending') : 'none' },
          h('button', { className:'c-th-sort', onClick: function () { onSort(c.sortKey); } }, c.label,
            active ? h('span', { 'aria-hidden':'true' }, sort.dir === 'asc' ? '↑' : '↓') : null));
      }))),
      h('tbody', null, rows.map(function (r, i) {
        var key = props.rowKey(r, i);
        var clickable = !!props.onRowClick;
        return h('tr', { key:key, className: clickable ? 'c-clickable' : undefined,
          tabIndex: clickable ? 0 : undefined, role: clickable ? 'button' : undefined,
          onClick: clickable ? function () { props.onRowClick(r); } : undefined,
          onKeyDown: clickable ? function (e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); props.onRowClick(r); } } : undefined },
          cols.map(function (c) {
            var cls = [c.primary ? 'c-td-tight' : null,
                       c.hideAt === 1 ? 'c-col-1' : c.hideAt === 2 ? 'c-col-2' : null].filter(Boolean).join(' ');
            return h('td', { key:c.key, className: cls || undefined,
              'data-label': c.label, 'data-primary': c.primary ? '1' : undefined,
              style:{ textAlign:c.align } }, c.render(r));
          }));
      })))));
}

/* 变更缓冲区：编辑先入草稿，提交前出 diff，确认后原子提交。 */
function useEdit(base, fields) {
  var s = useState(function () { return JSON.parse(JSON.stringify(base)); }), draft = s[0], setDraft = s[1];
  useEffect(function () { setDraft(JSON.parse(JSON.stringify(base))); }, [base]);
  var set = useCallback(function (k, v) {
    setDraft(function (d) { var n = Object.assign({}, d); n[k] = v; return n; });
  }, []);
  var changes = useMemo(function () {
    var out = [];
    fields.forEach(function (f) {
      var a = base[f.key], b = draft[f.key];
      var sa = JSON.stringify(a), sb = JSON.stringify(b);
      if (sa !== sb) out.push({ key:f.key, label:f.label, from:f.fmt ? f.fmt(a) : a, to:f.fmt ? f.fmt(b) : b });
    });
    return out;
  }, [base, draft, fields]);
  /* 每张卡片各自保存：按字段子集切分改动，互不牵连。 */
  var changesFor = useCallback(function (keys) {
    return changes.filter(function (c) { return keys.indexOf(c.key) >= 0; });
  }, [changes]);
  var resetKeys = useCallback(function (keys) {
    setDraft(function (d) {
      var n = Object.assign({}, d);
      keys.forEach(function (k) { n[k] = JSON.parse(JSON.stringify(base[k])); });
      return n;
    });
  }, [base]);
  /* 保存成功 = 把提交的值升为**新基线**。
     之前这里复用了 resetKeys，等于把草稿退回旧值 —— 界面提示「已保存」，字段却当场变回去。
     真实实现里新基线应当来自服务端返回的完整实体，而不是本地草稿。 */
  var commitKeys = useCallback(function (keys) {
    keys.forEach(function (k) { base[k] = JSON.parse(JSON.stringify(draft[k])); });
    setDraft(JSON.parse(JSON.stringify(base)));
  }, [base, draft]);
  return { draft:draft, set:set, changes:changes, dirty:changes.length > 0,
    changesFor:changesFor, resetKeys:resetKeys, commitKeys:commitKeys,
    reset: function () { setDraft(JSON.parse(JSON.stringify(base))); } };
}

/* 一张卡片一个保存条。传字段子集，只管这块。 */
function CardSave(props) {
  var changes = props.ed.changesFor(props.keys);
  /* disabled 是卡片级的硬门控。单靠给每个输入控件加 disabled 不可靠 ——
     组件是否真的支持这个属性得逐个确认（DS 的 RadioGroup 就只支持逐选项 disabled，
     组级传入会被静默忽略）。所以保存这一层必须自己再挡一道。 */
  return h(SaveBar, { count: props.disabled ? 0 : changes.length,
    hint: props.hint,
    onReset: function () { props.ed.resetKeys(props.keys); },
    onSave: function () { props.onSave(props.keys); } });
}

function fmtVal(v) {
  if (v === null || v === undefined || v === '') return '（空）';
  if (Array.isArray(v)) return v.length ? v.join('、') : '（空）';
  if (typeof v === 'boolean') return v ? '是' : '否';
  return String(v);
}

/* 改动到哪些字段算「风险项」—— 只有它们才升级到二次验证。

/**
 * 合并账户：两阶段。先算影响再确认 —— 合并是不可逆的，
 * 让人在看不见「到底会搬走什么」的情况下点确定，是不负责任的。

function MergeDialog(props) {
  var t = useState(''), target = t[0], setTarget = t[1];

  var s = useState(false), stepUp = s[0], setStepUp = s[1];

  var match = USERS.filter(function (x) {

    h('div', { className:'c-stack-sm' },
      !preview ? h(Fragment, null,
        h(TextField, { label:'并入目标账户（用户名或邮箱）', value:target, required:true,
          invalid: !!target.trim() && !match,
          hint: target.trim() && !match ? '找不到这个账户' : '本账户的绑定、授权与投稿归属会迁移过去，本账户置为已合并。',
          onChange: function (e) { setTarget(e.target.value); } }),
        match ? h(Card, { tone:'subtle', padding:'sm' },
          h('div', { className:'c-cell-primary' },
            h(Avatar, { name:match.name, size:32, label:match.name }),
            h('div', { className:'c-cell-text' },
              h('span', { className:'c-cell-name' }, match.name),
              h('span', { className:'c-cell-sub' }, match.email)))) : null)
        : h(Fragment, null,
            h('div', { className:'c-impact' },
              h('strong', null, '将从「' + u.name + '」迁移到「' + preview.name + '」：'),
              h('ul', { style:{ margin:'6px 0 0', paddingLeft:'1.1rem' } },
                h('li', null, u.bindings.length + ' 个第三方绑定'),
                h('li', null, u.grants.length + ' 个业务站授权（令牌族一并转移）'),

            h('p', { className:'c-note', style:{ margin:0 } },
              '合并不可撤销。「' + u.name + '」之后状态为已合并，无法登录。'),

}

/* ── 回调校验 ───────────────────────────────────────────────── */
function checkRedirect(raw, type) {
  var s = (raw || '').trim();
  if (!s) return null;
  var u;
  try { u = new URL(s); } catch (e) { return { level:'bad', msg:'不是合法的绝对地址' }; }
  if (u.hash) return { level:'bad', msg:'含 # 片段，OAuth 回调不允许' };
  if (s.indexOf('*') >= 0) return { level:'bad', msg:'不支持通配符，回调按精确匹配放行' };
  var local = u.hostname === 'localhost' || u.hostname === '127.0.0.1' || u.hostname === '[::1]';
  if (type === 'native' && u.protocol !== 'http:' && u.protocol !== 'https:')
    return { level:'ok', msg:'自定义 scheme，原生应用可用' };
  if (u.protocol === 'http:' && !local) return { level:'bad', msg:'生产环境必须用 https' };
  if (u.protocol === 'http:' && local) return { level:'ok', msg:'本地回环，开发环境放行' };
  if (u.protocol !== 'https:') return { level:'bad', msg:'只接受 https（本地回环除外）' };
  if (u.pathname === '/') return { level:'warn', msg:'建议指向具体回调路径，而非站点根' };
  return { level:'ok', msg:'可用' };
}

function UriEditor(props) {

    h(TextField, { label: props.label, value:draft, placeholder: props.placeholder,

      onChange: function (e) { setDraft(e.target.value); },

    h(Card, { accent:true }, h(SectionLabel, { as:'h3' }, '签名密钥'),
      h('p', { className:'c-note', style:{ marginTop:0 } },
        '轮换会同时发布 current 与 previous 两把公钥，已签发的令牌在宽限期内仍可验签。这是全站最高危操作。'),
      h(Table, { columns:[
        { key:'k', label:'kid', primary:true, render: function (k) { return h('code', { className:'c-mono' }, k.kid); } },
        { key:'s', label:'状态', render: function (k) {
          return h(Badge, { size:'sm', tone: k.status === 'current' ? 'green' : k.status === 'previous' ? 'amber' : 'muted',
            label: k.status === 'current' ? '签发中' : k.status === 'previous' ? '仅验签' : '已停用' }); } },
        { key:'a', label:'算法', hideAt:2, render: function (k) { return h('span', { className:'c-num' }, k.alg); } },
        { key:'c', label:'启用于', render: function (k) { return h('span', { className:'c-num' }, k.created); } },
        { key:'r', label:'轮换于', hideAt:1, render: function (k) { return h('span', { className:'c-num' }, k.rotated || '—'); } }],
        rows:KEYS, rowKey: function (k) { return k.kid; } }),
      can(props.role, 'pass.key:rotate')
        ? h('div', { style:{ marginTop:'var(--sp-4)' } },
            h(Btn, { variant:'danger', size:'sm', onClick: function () { setRotating(true); } }, '轮换签名密钥'))
        : h('p', { className:'c-note', style:{ marginBottom:0 } }, '轮换签名密钥需要 pass.key:rotate 权限。')),
    rotating ? h(DangerDialog, { title:'轮换签名密钥', subject:'kid_2026_07 → 新密钥',
      message:'生成新的 RS256 密钥对并立即用于签发。当前密钥降级为「仅验签」，上一把 kid_2026_01 停用。',
      impact:'所有业务站需在缓存的 JWKS 过期后刷新；接入方遇到未知 kid 时应自动重取 —— 未正确实现的接入方会短暂验签失败。',
      needStepUp:true, needReason:true, confirmText:'轮换密钥',
      onCancel: function () { setRotating(false); },
      onConfirm: function () { setRotating(false); setNotice('已轮换签名密钥（原型内不落库）'); } }) : null);
}

/* ═══════════════════════════════════════════════════════════════
   场景
   ═══════════════════════════════════════════════════════════════ */
function LoginScene(props) {
  return h('div', { className:'c-scene' }, h('div', { className:'c-scene-card' },
    h(Card, null,
      h('div', { className:'c-row', style:{ gap:'var(--sp-2)', marginBottom:'var(--sp-4)' } },
        h('span', { className:'c-brand-mark', style:{ width:30, height:30 } }, 'P'),
        h('div', { className:'c-brand-text' },
          h('span', { className:'c-brand-name', style:{ fontSize:15 } }, 'Pass 管理控制台'),
          h('span', { className:'c-brand-sub' }, 'transcircle.org/admin'))),
      h('p', { style:{ color:'var(--text-body)', fontSize:14, marginTop:0 } },
        '用你的 TransCircle 账户登录。管理权限来自 IAM，登录后自动生效。'),
      h('div', { className:'c-stack-sm' },
        h(TextField, { label:'邮箱或用户名', value:'mycbxzd', onChange: function () {} }),
        h(TextField, { label:'密码', type:'password', value:'password-here', onChange: function () {} }),
        h(Btn, { variant:'primary', fullWidth:true, onClick: props.onEnter }, '登录')),
      h('p', { className:'c-note', style:{ marginTop:'var(--sp-4)', marginBottom:0 } },
        '现状是：管理后台没有自己的入口，/admin/login 只是一句 Navigate，真正的入口是消费者登录页最底下一行小字。这里把它还原成一个真正的页面。'))));
}

function NoAccessScene(props) {
  return h('div', { className:'c-scene' }, h('div', { className:'c-scene-card' },
    h(Card, null,
      h(EmptyState, { icon: h(IconShield, null), title:'你的账户没有 Pass 管理权限',
        description:'登录成功了，但你在 IAM 的 tc_main 应用下没有被授予任何角色。请联系团队主或后端组长在 IAM 里配置，配置后重新登录即可生效。',
        action: h(Btn, { variant:'secondary', onClick: props.onBack }, '返回') }),
      h('p', { className:'c-note', style:{ marginTop:'var(--sp-4)', marginBottom:0 } },
        '说清楚三件事：权限在哪儿配、找谁配、配完要重新登录。现状只有一句「访问被拒绝」。'))));
}

/* ═══════════════════════════════════════════════════════════════
   外壳
   ═══════════════════════════════════════════════════════════════ */
function App() {
  var sc = useState('console'), scene = sc[0], setScene = sc[1];
  var r = useState('pass-admin'), role = r[0], setRole = r[1];
  var v = useState({ name:'overview' }), view = v[0], setView = v[1];
  var lo = useState(false), logout = lo[0], setLogout = lo[1];
  var th = useState('light'), theme = th[0], setTheme = th[1];
  var de = useState('comfortable'), dens = de[0], setDens = de[1];
  var rl = useState('full'), rail = rl[0], setRail = rl[1];
  /* IAM 可达性开关：用来演示 fail-closed —— 切成「不可达」后，所有绑定了统一身份的账户
     都会被按工作人员锁定，而不是因为查不到权限就放开。 */
  var iu = useState('up'), iamUp = iu[0], setIamUp = iu[1];
  IAM_REACHABLE.value = iamUp === 'up';
  var nt = useState(null), gnotice = nt[0], setGnotice = nt[1];

  useEffect(function () { document.documentElement.setAttribute('data-theme', theme); }, [theme]);
  useEffect(function () { document.documentElement.setAttribute('data-density', dens); }, [dens]);

  /* 左栏按视口宽度自动收成图标条，不用手动切 */
  useEffect(function () {
    /* 阈值选 1280 是算出来的，不是拍的：左栏 232→60 会让工作区骤增 172px。
       若折叠点落在容器断点（1040/860/700）附近，就会出现「视口变窄、表格列反而变多」。
       1280 时容器 = 1048（>1040），折叠后 = 1220，两侧都在同一档，单调。 */
    function onResize() { setRail(window.innerWidth < 1280 ? 'mini' : 'full'); }
    onResize();
    window.addEventListener('resize', onResize);
    return function () { window.removeEventListener('resize', onResize); };
  }, []);

  var devbar = h(DevBar, { scene:scene, setScene:setScene, role:role, setRole:setRole,
    theme:theme, setTheme:setTheme, dens:dens, setDens:setDens,
    iamUp:iamUp, setIamUp:setIamUp });

  /* 导航不带计数：手机端放不下，带了就得两套颗粒度。数量归概览。 */
  var NAV = [
    { key:'overview', label:'概览', icon:h(IconHome, null), perm:'pass.user:read' },
    { key:'users', label:'用户', icon:h(IconUsers, null), perm:'pass.user:read' },
    { key:'clients', label:'客户端', icon:h(IconApps, null), perm:'pass.client:read' },
    { key:'audit', label:'审计', icon:h(IconAudit, null), perm:'pass.audit:read' },
    { key:'staff', label:'员工与权限', icon:h(IconStaff, null), perm:'pass.audit:read' },
    { key:'security', label:'安全', icon:h(IconShield, null), perm:'pass.policy:manage' }
  ].filter(function (n) { return can(role, n.perm); });

  useEffect(function () {
    var vis = NAV.map(function (n) { return n.key; });
    var root = view.name.split('-')[0];
    var ok = vis.indexOf(view.name) >= 0 || vis.indexOf(root) >= 0 ||
      (view.name.indexOf('client') === 0 && vis.indexOf('clients') >= 0) ||
      (view.name.indexOf('user') === 0 && vis.indexOf('users') >= 0);
    if (!ok) setView({ name: vis[0] || 'users' });
  }, [role]);

  if (scene === 'login') return h(Fragment, null,
    h(LoginScene, { onEnter: function () { setScene('console'); } }), devbar);
  if (scene === 'noaccess') return h(Fragment, null,
    h(NoAccessScene, { onBack: function () { setScene('login'); } }), devbar);
  if (scene === 'consent') return h(Fragment, null, h(ConsentScene, null), devbar);

  var head, body;
  if (view.name === 'overview') {
    head = { title:'概览', sub:'系统当前状态' };
    body = h(OverviewPage, { go:setView });
  } else if (view.name === 'users') {
    head = { title:'用户', sub:'Pass 的 C 端账户 —— 业务站签发令牌的身份主体' };
    body = h(UsersPage, { role:role, initialStatus: view.status,
      onOpen: function (u) { setView({ name:'user-detail', user:u }); } });
  } else if (view.name === 'user-detail') {
    head = { title: view.user.name, back: function () { setView({ name:'users' }); }, backLabel:'用户' };
    body = h(UserDetail, { user: view.user, role:role });
  } else if (view.name === 'clients') {
    head = { title:'客户端', sub:'接入 Pass 单点登录的业务站' };
    body = h(ClientsPage, { role:role, onOpen: function (c) { setView({ name:'client-detail', client:c }); },
      onNew: function () { setView({ name:'client-new' }); } });
  } else if (view.name === 'client-new') {
    head = { title:'接入新站点', back: function () { setView({ name:'clients' }); }, backLabel:'客户端' };
    body = h(ClientWizard, { onCancel: function () { setView({ name:'clients' }); },
      onDone: function () { setView({ name:'clients' }); } });
  } else if (view.name === 'client-detail') {
    head = { title: view.client.name, back: function () { setView({ name:'clients' }); }, backLabel:'客户端' };
    body = h(ClientDetail, { client: view.client, role:role, onNew: function () { setView({ name:'client-new' }); } });
  } else if (view.name === 'audit') {
    head = { title:'审计', sub:'跨两个平面的 append-only 操作链' };
    body = h(AuditPage, null);
  } else if (view.name === 'staff') {
    head = { title:'员工与权限', sub:'IAM tc_main 的只读投影' };
    body = h(StaffPage, null);
  } else {
    head = { title:'安全', sub:'影响全生态的账户策略与签名密钥' };
    body = h(SecurityPage, { role:role });
  }

  return h('div', { className:'c-shell', 'data-rail':rail },
    h('nav', { className:'c-rail', 'aria-label':'控制台导航' },
      h('div', { className:'c-brand' },
        h('span', { className:'c-brand-mark' }, 'P'),
        h('span', { className:'c-brand-text' },
          h('span', { className:'c-brand-name' }, 'Pass'),
          h('span', { className:'c-brand-sub' }, '管理控制台'))),
      h('div', { className:'c-nav' },
        h('div', { className:'c-nav-group' }, '管理'),
        NAV.map(function (n) {
          var active = view.name === n.key ||
            (n.key === 'users' && view.name === 'user-detail') ||
            (n.key === 'clients' && (view.name === 'client-detail' || view.name === 'client-new'));
          return h('button', { key:n.key, className:'c-nav-item', title:n.label,
            'aria-current': active ? 'page' : undefined,
            onClick: function () { setView({ name:n.key }); } },
            h('span', { className:'c-nav-icon' }, n.icon),
            h('span', null, n.label));
        })),
      h('div', { className:'c-rail-foot' },
        h('button', { className:'c-me', onClick: function () { setLogout(true); }, title:'退出' },
          h(Avatar, { name:'翅膀', size:30, label:'翅膀' }),
          h('span', { className:'c-me-text' },
            h('span', { className:'c-me-name' }, '翅膀'),
            h('span', { className:'c-me-role' }, ROLES[role].label))))),

    h('main', { className:'c-main' },
      h('header', { className:'c-topbar' },
        h('div', { className:'c-crumb' },
          head.back ? h(Btn, { variant:'ghost', size:'sm', iconLeft:h(IconBack, null), onClick: head.back }, head.backLabel) : null,
          h('div', null,
            h('h1', { className:'c-title' }, head.title),
            head.sub ? h('div', { className:'c-subtitle' }, head.sub) : null))),
      h('div', { className:'c-body' },
        h('div', { className:'c-wide' },
          gnotice ? h('div', { style:{ marginBottom:'var(--sp-4)' } }, h(Alert, { tone:'success' }, gnotice)) : null,
          body))),

    logout ? h(ConfirmDialog, { open:true, title:'退出登录',
      message:'管理控制台复用你自己的账户会话 —— 没有单独的「管理员会话」可退。退出即登出整个账户。',
      confirmText:'退出登录', cancelText:'取消', tone:'danger',
      onCancel: function () { setLogout(false); },
      onConfirm: function () { setLogout(false); setScene('login'); } }) : null,

    devbar);
}

function DevBar(props) {
  function sel(label, value, onChange, options) {
    return h(Fragment, null,
      h('span', { className:'c-devbar-label' }, label),
      h('select', { value:value, onChange: function (e) { onChange(e.target.value); }, 'aria-label':label },
        options.map(function (o) { return h('option', { key:o[0], value:o[0] }, o[1]); })));
  }
  return h('div', { className:'c-devbar' },
    sel('主题', props.theme, props.setTheme, [['light','浅色'],['dark','深色']]),
    sel('密度', props.dens, props.setDens, [['comfortable','宽松'],['compact','紧凑']]),
    sel('身份', props.role, props.setRole, [['pass-admin','管理员'],['pass-ops','站点运营'],['pass-support','客服支持']]),
    sel('场景', props.scene, props.setScene,
      [['console','控制台'],['login','登录页'],['noaccess','无权限'],['consent','授权中间页']]),
    sel('IAM', props.iamUp, props.setIamUp, [['up','可达'],['down','不可达']]));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(Provider, null, h(App, null)));
})();
</script>
</body>
</html>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1268" height="1268" viewBox="-15 -2 1268 1268"
     role="img" aria-labelledby="title desc">
  <title id="title">Blue, pink and white interwoven circular mark</title>
  <desc id="desc">A transparent-background vector reconstruction made entirely from paths, gradients and SVG filters.</desc>

  <defs>
    <!-- The source silhouette is subtly organic rather than a mathematical circle. -->
    <path id="outer-shape" d="
      M 619 120
      C 900 120 1128 349 1128 632
      C 1128 915 900 1144 619 1144
      C 338 1144 110 915 110 632
      C 110 349 338 120 619 120 Z"/>

    <path id="inner-shape" d="
      M 619 322
      C 788 322 925 459 925 632
      C 925 802 788 939 619 939
      C 449 939 313 803 313 632
      C 313 460 449 322 619 322 Z"/>

    <path id="ring-shape" fill-rule="evenodd" d="
      M 619 120
      C 900 120 1128 349 1128 632
      C 1128 915 900 1144 619 1144
      C 338 1144 110 915 110 632
      C 110 349 338 120 619 120 Z
      M 619 322
      C 449 322 313 460 313 632
      C 313 803 449 939 619 939
      C 788 939 925 802 925 632
      C 925 459 788 322 619 322 Z"/>

    <!-- The blue ribbon is a genuine wrapped band. Its two inner joins cross
         through the transparent hole, so they never paint over the right rim. -->
    <path id="blue-shape" d="
      M 1060 373
      C 968 217 801 120 619 120
      C 430 120 270 220 180 375
      C 120 520 180 740 360 880
      C 480 970 650 1000 776 898
      C 700 800 580 650 505 535
      C 466 455 447 397 472 352
      C 555 284 680 253 810 281
      C 910 302 995 341 1060 373 Z"/>

    <clipPath id="ring-clip" clipPathUnits="userSpaceOnUse">
      <path clip-rule="evenodd" fill-rule="evenodd" d="
        M 619 120
        C 900 120 1128 349 1128 632
        C 1128 915 900 1144 619 1144
        C 338 1144 110 915 110 632
        C 110 349 338 120 619 120 Z
        M 619 322
        C 449 322 313 460 313 632
        C 313 803 449 939 619 939
        C 788 939 925 802 925 632
        C 925 459 788 322 619 322 Z"/>
    </clipPath>
    <clipPath id="blue-clip" clipPathUnits="userSpaceOnUse">
      <use href="#blue-shape"/>
    </clipPath>

    <!-- Pink ground: warm at the open right edge, cooler beneath the blue fold. -->
    <linearGradient id="pink-main" x1="340" y1="230" x2="1110" y2="910" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9b91bc"/>
      <stop offset="0.18" stop-color="#c391b0"/>
      <stop offset="0.42" stop-color="#f092ae"/>
      <stop offset="0.70" stop-color="#fa92b1"/>
      <stop offset="1" stop-color="#f38dac"/>
    </linearGradient>
    <radialGradient id="pink-bloom" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(1035 624) rotate(156) scale(470 610)">
      <stop offset="0" stop-color="#fb96b5" stop-opacity="0.32"/>
      <stop offset="0.52" stop-color="#f794b3" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#df7fa3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pink-edge-light" x1="1010" y1="330" x2="908" y2="990" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd0dc" stop-opacity="0.16"/>
      <stop offset="0.40" stop-color="#ffb4ca" stop-opacity="0"/>
      <stop offset="1" stop-color="#d96f99" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="pink-inner-soft" x1="925" y1="620" x2="760" y2="905" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fac0ce" stop-opacity="0.08"/>
      <stop offset="0.42" stop-color="#f8d4dc" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#f1eef0" stop-opacity="0.40"/>
    </linearGradient>
    <linearGradient id="pink-underfold-shadow" x1="475" y1="350" x2="875" y2="438" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4c8caf" stop-opacity="0.72"/>
      <stop offset="0.43" stop-color="#6f87aa" stop-opacity="0.52"/>
      <stop offset="0.76" stop-color="#a97799" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#cf85a1" stop-opacity="0.12"/>
    </linearGradient>

    <!-- White fold: faint rose near the pink seam and cool grey near the blue seam. -->
    <linearGradient id="white-main" x1="429" y1="1108" x2="910" y2="688" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="0.42" stop-color="#fefcf6"/>
      <stop offset="0.76" stop-color="#fbf8f3"/>
      <stop offset="1" stop-color="#f2ebe7"/>
    </linearGradient>
    <radialGradient id="white-soft-light" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(563 1112) scale(410 240)">
      <stop offset="0" stop-color="#fffef9" stop-opacity="0.56"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="white-seam-shadow" x1="853" y1="854" x2="969" y2="731" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8190aa" stop-opacity="0.22"/>
      <stop offset="0.40" stop-color="#bbb0bf" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#f1c0cf" stop-opacity="0"/>
    </linearGradient>

    <!-- Blue fold: brighter on its broad outer face, steel-blue at the inner bend. -->
    <linearGradient id="blue-main" x1="196" y1="268" x2="861" y2="1013" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#70c1f1"/>
      <stop offset="0.26" stop-color="#75c8f7"/>
      <stop offset="0.55" stop-color="#75c7f8"/>
      <stop offset="0.80" stop-color="#6ebdeb"/>
      <stop offset="1" stop-color="#8eaac9"/>
    </linearGradient>
    <radialGradient id="blue-sky-light" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(703 171) rotate(88) scale(630 520)">
      <stop offset="0" stop-color="#b2e5fd" stop-opacity="0.10"/>
      <stop offset="0.48" stop-color="#84d1f8" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#4e9ed8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue-inner-depth" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(375 520) rotate(-20) scale(230 260)">
      <stop offset="0" stop-color="#24466f" stop-opacity="0.72"/>
      <stop offset="0.38" stop-color="#386b9b" stop-opacity="0.46"/>
      <stop offset="0.78" stop-color="#5b9bd0" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#65b5e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blue-lower-depth" x1="580" y1="940" x2="850" y2="850" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b1a6ad" stop-opacity="0.50"/>
      <stop offset="0.45" stop-color="#aaa0aa" stop-opacity="0.42"/>
      <stop offset="0.80" stop-color="#b8adb5" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#d7cbd0" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="blue-pink-fold" x1="372" y1="310" x2="946" y2="415" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#559fd7" stop-opacity="0.18"/>
      <stop offset="0.35" stop-color="#708bb9" stop-opacity="0.58"/>
      <stop offset="0.70" stop-color="#aa88ad" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#e18dab" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="blue-white-fold" x1="180" y1="375" x2="776" y2="898" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#86c9ec" stop-opacity="0.30"/>
      <stop offset="0.32" stop-color="#9ed3ea" stop-opacity="0.42"/>
      <stop offset="0.68" stop-color="#c6e3e9" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#eeeae1" stop-opacity="0.34"/>
    </linearGradient>
    <linearGradient id="white-pink-fold" x1="807" y1="1102" x2="842" y2="850" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0ddd8" stop-opacity="0.24"/>
      <stop offset="0.44" stop-color="#f3d8dc" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#edb6c5" stop-opacity="0.42"/>
    </linearGradient>

    <!-- Identical material ramps for the final three-way symmetric ribbon. -->
    <linearGradient id="sector-pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5A9B8"/>
      <stop offset="0.42" stop-color="#F5A9B8"/>
      <stop offset="0.72" stop-color="#F5A9B8"/>
      <stop offset="1" stop-color="#F5A9B8"/>
    </linearGradient>
    <linearGradient id="sector-cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.42" stop-color="#FFFFFF"/>
      <stop offset="0.72" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="sector-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5BCEFA"/>
      <stop offset="0.42" stop-color="#5BCEFA"/>
      <stop offset="0.72" stop-color="#5BCEFA"/>
      <stop offset="1" stop-color="#5BCEFA"/>
    </linearGradient>

    <linearGradient id="seam-blue-pink" x1="476" y1="385" x2="1078" y2="367" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#79C9F2" stop-opacity="0.22"/>
      <stop offset="0.48" stop-color="#B5B6D9" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#EBAFC0" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="seam-pink-cream" x1="476" y1="385" x2="1078" y2="367"
                    gradientUnits="userSpaceOnUse" gradientTransform="rotate(120 619 632)">
      <stop offset="0" stop-color="#F5A9B8" stop-opacity="0.22"/>
      <stop offset="0.50" stop-color="#F9D3DB" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.20"/>
    </linearGradient>
    <linearGradient id="seam-cream-blue" x1="476" y1="385" x2="1078" y2="367"
                    gradientUnits="userSpaceOnUse" gradientTransform="rotate(240 619 632)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.50" stop-color="#C9EAF6" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#5BCEFA" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="white-local-shadow" x1="520" y1="390" x2="1035" y2="345"
                    gradientUnits="userSpaceOnUse" gradientTransform="rotate(125 619 632)">
      <stop offset="0" stop-color="#7896A2" stop-opacity="0"/>
      <stop offset="0.20" stop-color="#8FA8B2" stop-opacity="0.06"/>
      <stop offset="0.52" stop-color="#7896A2" stop-opacity="0.20"/>
      <stop offset="0.80" stop-color="#A9B7BA" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#A9B7BA" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blue-face-sheen" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(660 215) rotate(88) scale(540 475)">
      <stop offset="0" stop-color="#e2f6ff" stop-opacity="0.08"/>
      <stop offset="0.45" stop-color="#b4e7fc" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#8ecfeb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blue-inner-local" x1="470" y1="360" x2="315" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#617a9e" stop-opacity="0.28"/>
      <stop offset="0.40" stop-color="#315c88" stop-opacity="0.54"/>
      <stop offset="0.72" stop-color="#244e7d" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#5a8eb9" stop-opacity="0"/>
    </linearGradient>

    <!-- A directional inner-rim shadow, confined to the colored ring. -->
    <linearGradient id="inner-rim-shadow" x1="342" y1="411" x2="897" y2="883" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#405d7c" stop-opacity="0.32"/>
      <stop offset="0.35" stop-color="#5b7895" stop-opacity="0.18"/>
      <stop offset="0.65" stop-color="#89869a" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#696778" stop-opacity="0.24"/>
    </linearGradient>

    <!-- Soft drop shadow that surrounds the whole mark, so the white fold is
         separated from a light/white background. Cast from the ring shape so the
         central hole stays transparent. -->
    <filter id="mark-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="22"
                    flood-color="#2b2233" flood-opacity="0.55"/>
    </filter>

    <filter id="soften-18" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soften-10" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="surface-grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" seed="41" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faintNoise">
        <feFuncA type="table" tableValues="0 0.032"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faintNoise" mode="soft-light"/>
    </filter>
  </defs>

  <!-- No background rectangle: everything outside the mark and inside the hole is transparent. -->

  <!-- Drop shadow around the ring, drawn behind the mark to lift it off the
       background and reveal the white portion of the circle. -->
  <use href="#ring-shape" fill="#000000" filter="url(#mark-shadow)"/>

  <g clip-path="url(#ring-clip)">
    <!-- Bottom layer. -->
    <path d="M 0 0 H 1238 V 1268 H 0 Z" fill="url(#pink-main)"/>
    <path d="M 0 0 H 1238 V 1268 H 0 Z" fill="url(#pink-bloom)"/>
    <path d="M 868 248 C 1107 355 1184 590 1082 893 C 1017 1086 884 1160 761 1144
             C 942 1025 1034 811 1012 608 C 997 465 943 347 868 248 Z"
          fill="url(#pink-edge-light)"/>
    <path d="M 925 590 C 934 704 880 824 760 905"
          fill="none" stroke="url(#pink-inner-soft)" stroke-width="64"
          stroke-linecap="round" filter="url(#soften-18)"/>
    <path d="M 470 360 C 600 302 744 316 870 434"
          fill="none" stroke="url(#pink-underfold-shadow)" stroke-width="58"
          stroke-linecap="round" filter="url(#soften-18)"/>

    <!-- White fold rising from the lower-left and tapering under the pink. -->
    <path d="
      M 180 375
      L 0 300 L 0 1268 L 900 1268 L 795 1125
      C 850 1035 890 930 842 850
      C 820 820 795 850 776 898
      C 650 1000 480 970 360 880
      C 180 740 120 520 180 375 Z"
      fill="url(#white-main)"/>

    <!-- Upper blue ribbon. The right inner rim remains pink/cream, as in the source. -->
    <path d="
      M 1060 373
      C 968 217 801 120 619 120
      C 430 120 270 220 180 375
      C 120 520 180 740 360 880
      C 480 970 650 1000 776 898
      C 700 800 580 650 505 535
      C 466 455 447 397 472 352
      C 555 284 680 253 810 281
      C 910 302 995 341 1060 373 Z"
      fill="url(#blue-main)"/>
    <path d="
      M 1060 373
      C 968 217 801 120 619 120
      C 430 120 270 220 180 375
      C 120 520 180 740 360 880
      C 480 970 650 1000 776 898
      C 700 800 580 650 505 535
      C 466 455 447 397 472 352
      C 555 284 680 253 810 281
      C 910 302 995 341 1060 373 Z"
      fill="url(#blue-sky-light)"/>
    <path d="
      M 1060 373
      C 968 217 801 120 619 120
      C 430 120 270 220 180 375
      C 120 520 180 740 360 880
      C 480 970 650 1000 776 898
      C 700 800 580 650 505 535
      C 466 455 447 397 472 352
      C 555 284 680 253 810 281
      C 910 302 995 341 1060 373 Z"
      fill="url(#blue-face-sheen)"/>

    <!-- Local blue volume shadows are clipped back to the blue ribbon. -->
    <g>
      <path d="
        M 298 344
        C 241 452 248 611 287 737
        C 320 841 382 910 480 953
        C 422 891 381 821 356 741
        C 313 602 326 465 398 357 Z"
        fill="url(#blue-inner-depth)" filter="url(#soften-18)"/>
      <path d="M 472 352 C 375 410 313 512 313 632 C 313 658 316 682 322 704"
            fill="none" stroke="url(#blue-inner-local)" stroke-width="48"
            stroke-linecap="round" filter="url(#soften-10)"/>
    </g>

    <!-- A softly blended mauve fold instead of a hard blue/pink cut. -->
    <path d="M 472 352 C 555 284 680 253 810 281 C 910 302 995 341 1060 373"
          fill="none" stroke="url(#blue-pink-fold)" stroke-width="52"
          stroke-linecap="round" opacity="0.72" filter="url(#soften-10)"/>

    <!-- Final unified construction: one ribbon tile, repeated every 120 degrees. -->
    <g id="balanced-ribbons" transform="rotate(-30 619 632)">
      <path d="M 1078 367
               A 530 530 0 0 1 619 1162
               C 823 1063 956 793 904 632
               A 285 285 0 0 0 476 385
               C 590 260 890 240 1078 367 Z"
            fill="url(#sector-pink)"/>
      <path d="M 1078 367
               A 530 530 0 0 1 619 1162
               C 823 1063 956 793 904 632
               A 285 285 0 0 0 476 385
               C 590 260 890 240 1078 367 Z"
            transform="rotate(120 619 632)" fill="url(#sector-cream)"/>
      <path d="M 1078 367
               A 530 530 0 0 1 619 1162
               C 823 1063 956 793 904 632
               A 285 285 0 0 0 476 385
               C 590 260 890 240 1078 367 Z"
            transform="rotate(240 619 632)" fill="url(#sector-blue)"/>

      <!-- Short local fold shadow inside the white ribbon; intentionally not a ring. -->
      <path d="M 520 390 C 650 285 850 280 1035 345"
            transform="rotate(125 619 632)"
            fill="none" stroke="url(#white-local-shadow)" stroke-width="36"
            stroke-linecap="round" opacity="0.66" filter="url(#soften-10)"/>

      <!-- Identical soft seam treatment; only the intermediate hue changes. -->
      <path d="M 476 385 C 590 260 890 240 1078 367"
            fill="none" stroke="url(#seam-blue-pink)" stroke-width="52"
            stroke-linecap="round" opacity="0.72" filter="url(#soften-10)"/>
      <path d="M 476 385 C 590 260 890 240 1078 367"
            transform="rotate(120 619 632)"
            fill="none" stroke="url(#seam-pink-cream)" stroke-width="52"
            stroke-linecap="round" opacity="0.72" filter="url(#soften-10)"/>
      <path d="M 476 385 C 590 260 890 240 1078 367"
            transform="rotate(240 619 632)"
            fill="none" stroke="url(#seam-cream-blue)" stroke-width="52"
            stroke-linecap="round" opacity="0.72" filter="url(#soften-10)"/>
    </g>

  </g>
</svg>

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - run: npm install -g pnpm@12.16.1

      - uses: actions/setup-node@v5
        with:
          # 与 .node-version 保持一致；Node 22+ 自带 localStorage 全局，
          # src/test/setup.ts 已处理它与 jsdom 的冲突。
          node-version-file: .node-version
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

    <!-- 自托管展示字体（latin 子集可变字体）：DESIGN.md §2.6 / §9。
         中文由系统栈兜底，故仅预载拉丁子集，避免阻塞首屏。 -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/space-grotesk-latin.woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/nunito-brand-latin.woff2"
      crossorigin="anonymous"
    />

    <!-- 站点图标（由 scripts/generate-brand-assets.ts 生成，URL 须保持稳定）：
         - favicon.ico：16/32/48 多尺寸 BMP，给只认 /favicon.ico 的抓取器（百度、Bing、Yandex）；
         - 48 / 96 / 192 PNG：Google 搜索结果要求 ≥48px 的方形图标；
         - SVG：现代浏览器标签页矢量清晰；apple-touch-icon：iOS 主屏（满版不透明）。 -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/png" href="/favicon-48x48.png" sizes="48x48" />
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- 构建期由 scripts/prerender.ts 注入 JSON-LD（src/seo/structured-data.ts）。 -->
    <!--app-head-->

    <script>
      (function() {
        try {
          var theme = localStorage.getItem('transcircle-theme');
          if (theme && ['light', 'dark'].includes(theme)) {
            document.documentElement.setAttribute('data-theme', theme);
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {
          // 静默回退：不设置 data-theme，等待 React 接管
        }
      })();
    </script>
    <style id="legacy-browser-styles">
      /* 仅作用于 #legacy-fallback（旧浏览器回退页）：
         - 现代浏览器里该 div 保持 display:none，不参与渲染；
         - IE 11 不支持 CSS 自定义属性(var())，且应用打包 CSS 的 var() 在 IE 下全部失效，
           因此这里必须写成字面量，不能引用 --primary-pink 等 token。 */
      #legacy-fallback {
        background: #fdf9fb;
        min-height: 100vh;
      }
      #legacy-fallback .legacy-splash {
        display: block;
        max-width: 720px;
        margin: 2rem auto;
        padding: 1.5rem 1.75rem;
        background: #ffffff;
        border: 1px solid #eedfe6;
        border-radius: 12px;
        color: #3e3646;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.7;
      }
      #legacy-fallback .legacy-brand {
        display: block;
      }
      #legacy-fallback .legacy-brand img {
        display: block;
        width: 132px;
        height: auto;
      }
      #legacy-fallback .legacy-title {
        margin: 1rem 0 0.5rem;
        font-size: 1.35rem;
        line-height: 1.3;
        color: #1a1420;
      }
      #legacy-fallback .legacy-body {
        margin: 0 0 0.5rem;
        color: #3e3646;
      }
      #legacy-fallback .legacy-upgrade {
        margin: 1.1rem 0 0;
        padding: 0;
        list-style: none;
      }
      #legacy-fallback .legacy-upgrade li {
        margin: 0 0 0.5rem;
      }
      #legacy-fallback .legacy-upgrade a,
      #legacy-fallback .legacy-links a {
        color: #c22e68;
        font-weight: 600;
        text-decoration: underline;
      }
      #legacy-fallback .legacy-links {
        margin: 1.1rem 0 0;
        color: #6f6678;
        font-size: 0.95rem;
      }
      #legacy-fallback a:focus {
        outline: 2px solid #efa8c0;
        outline-offset: 2px;
      }
      @media (prefers-color-scheme: dark) {
        #legacy-fallback { background: #0c0a13; }
        #legacy-fallback .legacy-splash {
          background: #17131f;
          border-color: #2b2438;
          color: #cfc9da;
        }
        #legacy-fallback .legacy-title { color: #f5f2f8; }
        #legacy-fallback .legacy-body { color: #cfc9da; }
        #legacy-fallback .legacy-upgrade a,
        #legacy-fallback .legacy-links a { color: #ff8fbb; }
        #legacy-fallback .legacy-links { color: #9c94ac; }
      }
    </style>
  </head>
  <body>
    <!-- 构建期由 scripts/prerender.ts 注入首页预渲染标记（不执行 JS 的爬虫 / AI 由此读到正文）；
         src/main.tsx 用 createRoot 整体替换它。非首页路由由边缘 Worker 清空。 -->
    <div id="root"><!--app-html--></div>
    <!-- 旧浏览器（不支持 ES modules，如 IE 11 / Android 4.4 WebView / Chrome 30）会整体跳过
         type="module" 脚本，使本 SPA 不执行而白屏。此静态标记 + nomodule 脚本仅在无模块支持的
         浏览器上可见：默认 display:none，由下方脚本在检测到无模块支持时置为可见。
         IE 11 不支持 CSS 变量，样式见头部 #legacy-browser-styles（字面色值）。 -->
    <div id="legacy-fallback" style="display:none">
      <main class="legacy-splash">
        <header class="legacy-brand">
          <img src="/brand/transcircle-horizontal-on-light.svg" width="132" height="40" alt="TransCircle" />
        </header>
        <h1 class="legacy-title" id="legacy-title">浏览器版本过旧</h1>
        <p class="legacy-body" id="legacy-body">您当前使用的浏览器无法运行本站的现代界面，登录与账户功能不可用。请升级系统或改用较新浏览器后再访问。</p>
        <ul class="legacy-upgrade">
          <li><a href="https://www.microsoft.com/edge" target="_blank" rel="noopener noreferrer">Microsoft Edge</a></li>
          <li><a href="https://www.google.com/chrome/" target="_blank" rel="noopener noreferrer">Google Chrome</a></li>
          <li><a href="https://www.mozilla.org/firefox/" target="_blank" rel="noopener noreferrer">Mozilla Firefox</a></li>
        </ul>
        <p class="legacy-links">
          <a href="https://transcircle.org/s/join" target="_blank" rel="noopener noreferrer">申请表单</a>
          &nbsp;·&nbsp;
          <a href="https://x.com/TransCircleOrg" target="_blank" rel="noopener noreferrer">X (@TransCircleOrg)</a>
          &nbsp;·&nbsp;
          <a href="https://bsky.app/profile/TransCircle.org" target="_blank" rel="noopener noreferrer">Bluesky</a>
        </p>
      </main>
    </div>
    <script nomodule>
      (function () {
        var fallback = document.getElementById('legacy-fallback');
        if (!fallback) { return; }
        // 预渲染的首页标记依赖 CSS 变量，旧浏览器下排版全乱：隐藏它，只显示回退页。
        var root = document.getElementById('root');
        if (root) { root.style.display = 'none'; }
        // 识别 IE / 旧版 Edge(EdgeHTML)：IE 11 及以下 UA 含 MSIE / Trident / rv:11，旧版 Edge 含 Edge/。
        var ua = navigator.userAgent;
        var isIE = /MSIE|Trident|Edge\//.test(ua);
        var title = document.getElementById('legacy-title');
        var body = document.getElementById('legacy-body');
        if (isIE) {
          if (title) { title.textContent = 'Internet Explorer 不再受支持，无法登录'; }
          if (body) {
            body.textContent = '主站的登录、两步验证与通行密钥等账户功能需要现代浏览器才能安全运行。' +
              '为保障你的账户安全，我们不再支持 Internet Explorer。' +
              '请使用较新的 Microsoft Edge、Google Chrome 或 Mozilla Firefox 登录。';
          }
        }
        // 非 IE 的无模块浏览器（如 Android 4.4 WebView / Chrome 30）沿用默认文案，无需改写。
        fallback.style.display = 'block';
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
